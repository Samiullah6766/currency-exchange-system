spring.application.name=financial-system

# Central synchronization server
sync.server.url=http://YOUR_CENTRAL_SERVER_IP:8081/sync

# MySQL database
spring.datasource.url=jdbc:mysql://localhost:3306/YOUR_DATABASE_NAME
spring.datasource.username=YOUR_MYSQL_USERNAME
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Application folders
backup.folder=C:\\CurrencyExchange\\Backups
upload.folder=C:\\CurrencyExchange\\uploads\\logos

# MySQL backup configuration
mysql.database=YOUR_DATABASE_NAME
mysql.username=YOUR_MYSQL_USERNAME
mysql.password=YOUR_MYSQL_PASSWORD
mysql.bin.path=C:\\Program Files\\MySQL\\MySQL Server 8.0\\bin